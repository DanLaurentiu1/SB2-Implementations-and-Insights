algorithm:
  _target_: algorithms.bandits.implementations.BanditAgent.BanditAgent
  params:
    action_value_update_strategy:
      _target_: algorithms.bandits.implementations.action_value_update.AverageSampling.AverageSampling
    exploration_strategy:
      _target_: algorithms.bandits.implementations.exploration.UpperConfidenceBound.UpperConfidenceBound
      uncertainty_coefficient: 2
    action_value_initialization_strategy:
      _target_: algorithms.bandits.implementations.action_value_initialization.NormalActionValueInitialization.NormalActionValueInitialization
    metrics:
    - step
    - action
    - reward
    - total_reward
    - average_reward
    - optimal_chosen_counter
    - optimal_chosen_percentage
environment:
  _target_: environments.custom_envs.BanditEnvs.KArmEnvironment.KArmEnvironment
  params:
    number_of_arms: 10
    max_steps: 1000
    drift_strategy:
      _target_: environments.custom_envs.BanditEnvs.drift.NoDrift.NoDrift
    reward_strategy:
      _target_: environments.custom_envs.BanditEnvs.reward.GaussianReward.GaussianReward
      variance: 1
run:
  name: Figure_2.4
  episodes: 1
  agent_seed: 16
  env_seed: 2015
repro_folder_name: Figure_2.4
